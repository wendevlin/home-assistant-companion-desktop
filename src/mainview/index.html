<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Desktop</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="app">
        <div id="settings-page" class="page">
            <div class="container">
                <h1>🏠 Home Assistant Desktop</h1>
                <p class="subtitle">Connect to your Home Assistant server</p>

                <div class="settings-section">
                    <h2>Server Configuration</h2>
                    <form id="settings-form">
                        <div class="form-group">
                            <label for="server-url">Home Assistant Server URL</label>
                            <input
                                type="url"
                                id="server-url"
                                name="server-url"
                                placeholder="https://homeassistant.local:8123"
                                required
                            >
                            <p class="help-text">Enter the full URL of your Home Assistant server including http:// or https://</p>
                        </div>
                        <button type="submit" class="btn-primary">Connect</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="webview-page" class="page hidden">
            <electrobun-webview
                id="ha-webview"
                partition="persist:homeassistant"
            ></electrobun-webview>
        </div>
    </div>

    <script type="module" src="index.ts"></script>
</body>
</html>
